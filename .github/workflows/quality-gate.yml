name: quality-gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "infra/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "infra/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout pinned repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: |
          pnpm typecheck
          pnpm --filter @opus8-cf/control-plane build
          pnpm --filter @opus8-cf/admin-ui build
          pnpm --filter @opus8-cf/edge-node build
      - name: Static security and compatibility tests
        run: |
          pnpm --filter @opus8-cf/control-plane test:cors
          pnpm --filter @opus8-cf/control-plane test:signature
          pnpm --filter @opus8-cf/control-plane test:integration-auth
          pnpm --filter @opus8-cf/control-plane test:automation-auth
          pnpm --filter @opus8-cf/control-plane test:admin-login-rate-limit
          pnpm --filter @opus8-cf/control-plane test:webmaster-benefit
          pnpm --filter @opus8-cf/control-plane test:deploy-preflight
          pnpm --filter @opus8-cf/control-plane test:key-rotation
          pnpm --filter @opus8-cf/control-plane test:d1-backup
          pnpm --filter @opus8-cf/control-plane test:subscription-rate-limit
          pnpm --filter @opus8-cf/control-plane test:subscription
          pnpm --filter @opus8-cf/control-plane test:subscription-rules
          pnpm --filter @opus8-cf/control-plane test:optimized-ip
          pnpm --filter @opus8-cf/control-plane test:device-credentials
          pnpm --filter @opus8-cf/control-plane test:usage-aggregation
          pnpm --filter @opus8-cf/control-plane test:operations-hardening
          pnpm --filter @opus8-cf/control-plane test:node-matrix
          pnpm --filter @opus8-cf/control-plane test:data-maintenance
          pnpm --filter @opus8-cf/control-plane test:compliance
          pnpm --filter @opus8-cf/control-plane test:resource-audit
          pnpm --filter @opus8-cf/control-plane test:transport-path
          pnpm --filter @opus8-cf/control-plane test:schema-migration
          pnpm --filter @opus8-cf/control-plane test:client-compatibility
          pnpm --filter @opus8-cf/control-plane test:supply-chain
          pnpm --filter @opus8-cf/edge-node test:policy
      - name: Local Worker integration tests
        run: |
          pnpm --filter @opus8-cf/control-plane test:compliance:local
          pnpm --filter @opus8-cf/control-plane test:integration:local
      - name: Dependency vulnerability gate
        run: pnpm audit --audit-level high --registry=https://registry.npmjs.org

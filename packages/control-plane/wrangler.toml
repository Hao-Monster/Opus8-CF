# 控制面 Worker（部署在主账号 acc1）
name = "opus8cf-control"
main = "dist/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
USE_OPTIMIZED_IPS = "1"
SUB_MAX_OPTIMIZED_IPS_PER_NODE = "8"
SUB_RATE_LIMIT_REQUIRED = "1"
ADMIN_LOGIN_RATE_LIMIT_REQUIRED = "1"
COMPLIANCE_PROXY_ALLOWED = "1"
COMPLIANCE_ENFORCEMENT_MODE = "observe-only"
COMPLIANCE_POLICY_ID = "cloudflare-data-plane-v1"
COMPLIANCE_MAINTENANCE_NODE_IDS = "acc1-n1,acc1-n2,acc2-n1,acc2-n2"
HMAC_V1_ACCEPT_UNTIL = "0"
HMAC_V1_NODE_IDS = ""
AUTOMATION_ALLOWED_IDS = "github-node-deploy"

[triggers]
crons = ["17 */6 * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 0.05

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# Configure these with `wrangler secret put` before enabling the FreedomPost
# server-to-server benefit integration. The HMAC secret must be at least 32
# characters and must not reuse an admin, JWT, landing, or node secret.
# FREEDOMPOST_INTEGRATION_KEY_ID
# FREEDOMPOST_INTEGRATION_SECRET

[[ratelimits]]
name = "SUB_SOURCE_RATE_LIMITER"
namespace_id = "683401"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "SUB_TOKEN_RATE_LIMITER"
namespace_id = "683402"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "ADMIN_LOGIN_RATE_LIMITER"
namespace_id = "683403"

  [ratelimits.simple]
  limit = 10
  period = 60

# routes 由 CI 按 ROOT_DOMAIN 注入，如 api.<ROOT_DOMAIN>/*

[[d1_databases]]
binding = "DB"
database_name = "opus8cf-db"
database_id = "PLACEHOLDER_FILL_AFTER_PREFLIGHT"

[[kv_namespaces]]
binding = "KV"
id = "PLACEHOLDER_FILL_AFTER_PREFLIGHT"

# secrets（wrangler secret put 或 CI 注入）：
#   ADMIN_PASSWORD  管理后台密码
#   JWT_SECRET      管理 JWT 签名
#   JWT_SECRET_PREVIOUS JWT 轮换期的旧签名密钥（可选）
#   NODE_HMAC_SECRET 控制面根密钥：派生每节点运行密钥、注册令牌摘要和设备凭据
#   NODE_HMAC_SECRET_PREVIOUS 控制面根密钥滚动轮换期的旧值（可选）
#   LANDING_CONFIG_KEY 落地机账号密码的静态加密密钥（至少 32 字符）
#   LANDING_CONFIG_KEY_PREVIOUS 落地凭据重加密前的旧密钥（可选）
#   AUTOMATION_HMAC_SECRET 节点部署自动化专用 HMAC 密钥（至少 32 字符，不与其他密钥复用）

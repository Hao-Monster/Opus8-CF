# 边缘节点 Worker 部署模板（P1/P3 使用）
# 实际部署时由 CI 按账号注入 name/routes/vars，此处为基线。
name = "opus8cf-node"
main = "dist/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 生产部署由 infra/scripts/deploy-node.sh 注入 Targeted Placement。
# [placement]
# host = "203.0.113.10:40011"

# 由 CI/控制面注入的变量（示意）
[vars]
CONTROL_PLANE_URL = ""   # 控制面 API 基址，如 https://api.<ROOT_DOMAIN>
NODE_ID = ""             # 部署时生成
# 每节点独立 HMAC 密钥由一次性注册任务下发，再用 secret 注入：wrangler secret put NODE_HMAC_SECRET

# KV：缓存同步下来的「有效 UUID 集」/分流规则（每账号一个）
# [[kv_namespaces]]
# binding = "KV"
# id = "<preflight 输出后填入>"
